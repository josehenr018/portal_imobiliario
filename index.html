<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Imobiliário | Real Estate Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #00ffa3;
            --primary-dark: #00b372;
            --bg: #05070a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --glass: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.6;
        }

        /* --- NAVIGATION --- */
        nav {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 7, 10, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
        .logo span { color: var(--primary); }

        /* --- HERO SECTION --- */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(0, 255, 163, 0.05) 0%, transparent 70%);
            padding: 0 20px;
        }

        .hero h1 { font-size: 56px; font-weight: 800; margin-bottom: 10px; }
        .hero p { color: var(--text-dim); font-size: 18px; max-width: 600px; }

        /* --- SIMULATOR PANEL (Glassmorphism) --- */
        .container { max-width: 1200px; margin: -100px auto 50px; padding: 0 20px; }

        .simulator-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 12px; font-weight: 600; color: var(--primary); text-transform: uppercase; margin-bottom: 8px; }
        
        .input-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
        }

        .input-group input:focus { border-color: var(--primary); outline: none; background: rgba(255, 255, 255, 0.1); }

        .btn-calculate {
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            height: 55px;
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-calculate:hover { background: var(--primary-dark); transform: translateY(-3px); }

        /* --- RESULTS SECTION --- */
        .results-bar {
            margin: 30px 0;
            text-align: center;
            animation: fadeIn 1s ease;
        }

        .results-bar h2 { font-size: 32px; color: var(--primary); }
        .results-bar p { color: var(--text-dim); }

        /* --- PROPERTY GRID --- */
        .property-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transition: 0.4s;
        }

        .card:hover { transform: translateY(-10px); border-color: var(--primary); }

        .card-img {
            width: 100%;
            height: 240px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .status-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--primary);
            color: #000;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
        }

        .card-body { padding: 25px; }
        .card-body h3 { font-size: 22px; margin-bottom: 10px; }
        .card-price { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 15px; }
        
        .card-features {
            display: flex;
            gap: 15px;
            color: var(--text-dim);
            font-size: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>

    <nav>
        <div class="logo">LU<span>NAR</span> INTEL</div>
        <div style="color: var(--text-dim); font-size: 14px;">Demo: Gerência de Projetos</div>
    </nav>

    <section class="hero">
        <h1>O Seu Novo Lar.</h1>

            <div class="input-group">

                <input type="number" id="savings" placeholder="Ex: 40.000">

            <button class="btn-calculate" onclick="calculate()">

        </div>

        <main class="property-grid" id="grid">

            { id: 6, title: "Casa Familiar Norte", price: 275000, rooms: 3, baths: 2, img: "https://images.unsplash.com/photo-1449844908441-8829872d2607?auto=format&fit=crop&w=600&q=80" }
        ];

        function calculate() {
            const income = parseFloat(document.getElementById('income').value);
            const age = parseInt(document.getElementById('age').value);
            const savings = parseFloat(document.getElementById('savings').value) || 0;

            if (!income || !age) {
                alert("Por favor, preencha a renda e a idade.");
                return;
            }

            // LÓGICA DE NEGÓCIO: Comprometimento de 30% da renda
            const maxInstallment = income * 0.30;
            // Coeficiente simplificado de financiamento (aprox. SAC 30 anos)
            const financingPower = maxInstallment / 0.0082;
            const totalPower = financingPower + savings;

            // UI Updates
            document.getElementById('results-bar').style.display = 'block';
            document.getElementById('total-buy-power').innerText = `R$ ${totalPower.toLocaleString('pt-BR', {maximumFractionDigits: 0})}`;

            render(totalPower);
        }

        function render(limit) {
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            
            const filtered = propertyData.filter(p => p.price <= limit);

            if(filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim);">Nenhum imóvel disponível para este perfil financeiro no momento.</p>`;
                return;
            }

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img" style="background-image: url('${p.img}')">
                            <div class="status-tag">FINANCIAMENTO DISPONÍVEL</div>
                        </div>
                        <div class="card-body">
                            <h3>${p.title}</h3>
                            <div class="card-price">R$ ${p.price.toLocaleString('pt-BR')}</div>
                            <div class="card-features">
                                <span><i class="fa-solid fa-bed"></i> ${p.rooms} Quartos</span>
                                <span><i class="fa-solid fa-bath"></i> ${p.baths} Casas de Banho</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Mostrar tudo ao carregar
        render(2000000);
    </script>
