<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Criar Conta | LUNAR INTEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">LU<span>NAR</span> INTEL</a>
        <div class="nav-links"><a href="login.html">Entrar</a></div>
    </nav>

    <div class="container-narrow" style="max-width:560px;">
        <div class="panel">
            <h2><i class="fa-solid fa-user-plus"></i> Criar Conta</h2>
            <div id="alerta"></div>

            <div class="tabs">
                <button type="button" class="tab-btn active" data-tipo="CLIENTE">Sou Cliente</button>
                <button type="button" class="tab-btn" data-tipo="CORRETOR">Sou Corretor</button>
            </div>

            <form id="form-cadastro">
                <div class="grid-form">
                    <div class="input-group">
                        <label>Nome completo</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="input-group">
                        <label>CPF</label>
                        <input type="text" id="cpf" required>
                    </div>
                    <div class="input-group">
                        <label>Telefone</label>
                        <input type="text" id="telefone" required>
                    </div>
                    <div class="input-group">
                        <label>Senha</label>
                        <input type="password" id="senha" minlength="6" required>
                    </div>
                </div>

                <div id="campos-cliente" class="grid-form">
                    <div class="input-group">
                        <label>Idade</label>
                        <input type="number" id="idade" min="18" max="70">
                    </div>
                    <div class="input-group">
                        <label>Renda mensal (R$)</label>
                        <input type="number" id="rendaMensal">
                    </div>
                    <div class="input-group">
                        <label>Poupança (R$)</label>
                        <input type="number" id="poupanca">
                    </div>
                    <div class="input-group">
                        <label>FGTS (R$)</label>
                        <input type="number" id="fgts">
                    </div>
                    <div class="input-group">
                        <label>Profissão</label>
                        <input type="text" id="profissao">
                    </div>
                </div>

                <div id="campos-corretor" class="grid-form" style="display:none;">
                    <div class="input-group">
                        <label>Registro CRECI (ex: 12345-F)</label>
                        <input type="text" id="creci">
                    </div>
                    <div class="input-group">
                        <label>Especialidade</label>
                        <input type="text" id="especialidade">
                    </div>
                </div>

                <button type="submit" class="btn btn-block" style="margin-top:10px;">Criar conta</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let tipoSelecionado = 'CLIENTE';

        document.querySelectorAll('.tab-btn').forEach((botao) => {
            botao.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
                botao.classList.add('active');
                tipoSelecionado = botao.dataset.tipo;
                document.getElementById('campos-cliente').style.display = tipoSelecionado === 'CLIENTE' ? 'grid' : 'none';
                document.getElementById('campos-corretor').style.display = tipoSelecionado === 'CORRETOR' ? 'grid' : 'none';
            });
        });

        const paginaPorPerfil = { CLIENTE: 'cliente.html', CORRETOR: 'corretor.html', ADMINISTRADOR: 'admin.html' };

        document.getElementById('form-cadastro').addEventListener('submit', async (evento) => {
            evento.preventDefault();

            const payload = {
                tipo: tipoSelecionado,
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                cpf: document.getElementById('cpf').value,
                telefone: document.getElementById('telefone').value,
                senha: document.getElementById('senha').value,
            };

            if (tipoSelecionado === 'CLIENTE') {
                payload.idade = Number(document.getElementById('idade').value);
                payload.rendaMensal = Number(document.getElementById('rendaMensal').value) || 0;
                payload.poupanca = Number(document.getElementById('poupanca').value) || 0;
                payload.fgts = Number(document.getElementById('fgts').value) || 0;
                payload.profissao = document.getElementById('profissao').value;
            } else {
                payload.creci = document.getElementById('creci').value;
                payload.especialidade = document.getElementById('especialidade').value;
            }

            try {
                await Api.post('/auth/cadastro', payload);
                const usuario = await Api.post('/auth/login', { email: payload.email, senha: payload.senha });
                window.location.href = paginaPorPerfil[usuario.tipo];
            } catch (erro) {
                mostrarAlerta('alerta', erro.message);
            }
        });
    </script>
</body>
</html>
